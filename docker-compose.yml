# This branch has its own compose project, so its containers and volumes (Postgres, Redis, Qdrant if local) are separate from the
# older branch's: the demo branch keeps its database untouched, and this one migrates its own copy. Override with COMPOSE_PROJECT_NAME.
name: ${COMPOSE_PROJECT_NAME:-investment_analyst_new}

# Settings shared by the api and both workers (one image, built once).
# The app reads the rest of its configuration from .env (and config.yaml, if you mount one and set APP_CONFIG_FILE).
# Inside these containers the services are reached by name, so the URLs below replace the localhost ones in .env.
# To use managed services instead (RDS, ElastiCache, Qdrant Cloud...), set COMPOSE_DATABASE_URL / COMPOSE_REDIS_URL /
# COMPOSE_QDRANT_URL in .env.
x-backend: &backend
  image: investment-analyst-backend
  build: ./backend
  restart: unless-stopped
  env_file:
    - .env
  environment:
    DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://${POSTGRES_USER:-investment_analyst}:${POSTGRES_PASSWORD:-investment_analyst}@postgres:5432/${POSTGRES_DB:-investment_analyst}}
    REDIS_URL: ${COMPOSE_REDIS_URL:-redis://redis:6379/0}
    QDRANT_URL: ${COMPOSE_QDRANT_URL:-http://qdrant:6333}
  volumes:
    - ./data:/app/data

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Each app process (api + every worker) keeps its own connection pool of up to DB_POOL_SIZE + DB_MAX_OVERFLOW
    # (default 30). 200 leaves room for the api, two workers and extra scaled workers (--scale worker-interactive=N).
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-investment_analyst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-investment_analyst}
      POSTGRES_DB: ${POSTGRES_DB:-investment_analyst}
    ports:
      # Host-side 5433 to avoid clashing with a locally-installed Postgres on
      # the default 5432 — the container still listens on 5432 internally, so
      # other services in this compose file (the "postgres" hostname) are unaffected.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-investment_analyst}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    <<: *backend
    ports:
      # Only the API is published. The five MCP servers run inside this container on loopback; the workers reach them
      # because they share this container's network (network_mode: service:api below).
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy

  worker-interactive:
    <<: *backend
    entrypoint: ["./docker/worker-entrypoint.sh"]
    command: ["app.worker.InteractiveWorkerSettings"]
    # Shares the api container's network so its http://localhost:85xx/mcp calls reach the MCP servers the api container
    # hosts. It therefore inherits api's ports and must not declare its own. Scale with --scale worker-interactive=N.
    network_mode: "service:api"
    depends_on:
      api:
        condition: service_started

  worker-batch:
    <<: *backend
    entrypoint: ["./docker/worker-entrypoint.sh"]
    command: ["app.worker.BatchWorkerSettings"]
    network_mode: "service:api"
    depends_on:
      api:
        condition: service_started

  # Web UI (optional): docker compose --profile ui up -d --build
  # Builds frontend/ and serves it on UI_PORT (default 3000).
  # VITE_API_BASE_URL is baked in at build time: it is the address the *browser* uses to reach the API.
  ui:
    profiles: ["ui"]
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "${UI_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  pgdata:
  qdrant_storage:
  redis_data:
